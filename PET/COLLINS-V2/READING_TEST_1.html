.start-wrap{min-height:100vh;display:grid;place-items:center;padding:28px}.start-card{max-width:900px;width:100%;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:34px}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--brand);font-weight:800}.start-card h1{font-size:clamp(30px,5vw,48px);line-height:1.08;margin:.3em 0}.start-card p{color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.field label{font-weight:750;display:block;margin-bottom:7px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid #bfc9d8;border-radius:12px;background:#fff}.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}.mode-card{border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer}.mode-card.active{border-color:var(--brand);background:var(--soft)}.mode-card input{margin-right:8px}.rules{background:#f7f9fd;border:1px solid var(--line);border-radius:14px;padding:14px 18px}.confirm{display:flex;gap:10px;align-items:flex-start;margin:18px 0}.confirm input{margin-top:5px}.start-actions{display:flex;justify-content:flex-end}
.exam{max-width:1480px;margin:auto;padding:18px}.part-tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 12px;position:sticky;top:58px;z-index:30;background:var(--bg)}.part-tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:750;white-space:nowrap}.part-tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}.progress-row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 16px}.navq{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:750}.navq.answered{background:#e7f7ef;border-color:#80c9aa}.navq.flagged{box-shadow:inset 0 -4px 0 #f0b429}.navq.current{outline:3px solid #9db5ff}.navq.locked{opacity:.55}.part-head{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}.part-head h2{margin:0 0 4px}.instruction{font-weight:650;color:#35465f}.question-card,.source-card,.bank-card,.passage-box,.review-card,.result-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px rgba(16,33,58,.04)}.question-card{padding:18px;margin-bottom:14px}.qtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.qnum{font-weight:850;color:var(--brand)}.flagbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:13px}.flagbtn.on{background:#fff4d8;border-color:#e5ad2f}.options{display:grid;gap:9px;margin-top:12px}.option{display:flex;gap:10px;align-items:flex-start;border:1px solid #cfd7e3;border-radius:12px;padding:11px 12px;background:#fff;text-align:left;width:100%}.option:hover{border-color:#8ca7ef}.option.selected{border-color:var(--brand);background:var(--soft)}.letter{font-weight:850;min-width:22px}.source-grid{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(360px,1.1fr);gap:18px}.source-card{padding:18px;align-self:start}.emailbox{border:1px solid #8e98a7}.emailhead{background:#e3e7eb;padding:6px 9px;border-bottom:1px solid #8 put{display:inline-block;vertical-align:baseline;width:110px;max-width:35vw;border:0;border-bottom:2px dotted #68768a;background:#fff;padding:2px 5px;font-family:ui-sans-serif,system-ui;font-size:18px}.cloze-pop{display:inline-flex;position:relative}.cloze-menu{position:absolute;top:100%;left:0;z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:220px}.cloze-menu button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:8px;border-radius:7px}.cloze-menu button:hover{background:var(--soft)}
.results{max-width:1240px;margin:auto;padding:24px}.results h1{margin-bottom:4px}.result-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.metric strong{font-size:28px;display:block}.part-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.diag{margin:18px 0;padding:18px}.review-toolbar{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:58px;background:var(--bg);padding:10px 0;z-index:20}.review-card{padding:18px;margin:12px 0}.review-card.correct{border-left:6px solid var(--ok)}.review-card.incorrect{border-left:6px solid var(--bad)}.review-card.blank{border-left:6px solid #7a879a}.review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}.review-box{border-radius:11px;padding:12px;background:#f7f9fd;border:1px solid var(--line)}.review-box h5{margin:0 0 5px;font-size:14px;color:#40506a;text-transform:uppercase;letter-spacing:.04em}.review-box.evidence{grid-column:1/-1;border-left:4px solid var(--brand)}.review-box.explain{grid-column:1/-1;border-left:4px solid var(--ok)}.review-box.trap{grid-column:1/-1;border-left:4px solid #e28a13}.review-box.lang{grid-column:1/-1;border-left:4px solid #6f42c1}.review-box.next{grid-column:1/-1;border-left:4px solid #0f8b8d}.review-source{white-space:pre-line}.filterbtn.active{background:var(--brand);color:white}.retrybar{margin:22px 0;padding:18px;background:#eef4ff;border:1px solid #b7c8ff;border-radius:16px}.toast{position:fixed;right:18px;bottom:18px;background:#10213a;color:white;padding:12px 16px;border-radius:10px;z-index:100;box-shadow:var(--shadow)}

<script>
const TEST={"id": "TEST_1", "title": "B1 Preliminary Reading Practice Test 1", "schemaVersion": 1, "parts": 6, "totalQuestions": 32, "answers": {"1": "A", "2": "C", "3": "A", "4": "B", "5": "A", "6": "D", "7": "F", "8": "G", "9": "A", "10": "C", "11": "B", "12": "D", "13": "C", "14": "B", "15": "A", "16": "F", "17": "B", "18": "H", "19": "D", "20": "A", "21": "C", "22": "A", "23": "D", "24": "A", "25": "B", "26": "C", "27": "in", "28": "are", "29": "the", "30": "for", "31": "being", "32": "what"}, "reviews": {"1": {"distractors": ["B sai: người bị cảm và không khỏe là Cristine; không có thông tin Alison không đói.", "C sai: Cristine nhờ Alison nói với mẹ Alison, chứ không nói Cristine phải trực tiếp nói chuyện với bà."], "vocabulary": ["catch a cold = bị cảm", "apologise to someone = xin lỗi ai", "as soon as possible = càng sớm càng tốt"], "cohesionChain": [], "correctDisplay": "A — Alison should apologise to her mum.", "relevantText": "Message from Cristine to Alison: “I’ve caught a cold and don’t feel well at all. Can you apologise to your mum for me and tell her as soon as possible that I can’t come for dinner?”\nA. Alison should apologise to her mum.  B. Alison isn’t feeling hungry.  C. Cristine should speak to her mum quickly.", "keyEvidence": "“Can you apologise to your mum for me and tell her as soon as possible that I can’t come for dinner?”", "explanationVi": "Cristine đang nhờ Alison chuyển lời xin lỗi tới mẹ của Alison vì Cristine không thể đến ăn tối. Vì vậy người cần thực hiện hành động ‘apologise to her mum’ là Alison.", "paraphrase": "Can you apologise to your mum for me? ↔ Alison should apologise to her mum.", "nextTimeFocus": "Theo dõi đúng người thực hiện hành động. Trong tin nhắn ngắn, pronoun và người nhận thường quyết định đáp án.", "answer": "A"}, "2": {"distractors": ["A sai: ‘carry out work on the computers’ không đồng nghĩa với tất cả máy tính đang hỏng.", "B sai: ‘close earlier today at 4.30’ cho thấy 4.30 là giờ đóng sớm riêng hôm nay, không phải giờ thường lệ."], "vocabulary": ["close earlier = đóng cửa sớm hơn", "carry out work on = tiến hành công việc/sửa chữa trên", "as usual = như thường lệ"], "cohesionChain": [], "correctDisplay": "C — Pupils can use the IT Centre tomorrow.", "relevantText": "IT Centre notice: “We will close earlier today at 4.30 to carry out work on the computers. We will open as usual tomorrow.”\nA. The computers in the IT Centre aren’t working.  B. The IT Centre usually closes at 4.30.  C. Pupils can use the IT Centre tomorrow.", "keyEvidence": "“We will open as usual tomorrow.”", "explanationVi": "Thông báo chỉ nói hôm nay trung tâm đóng sớm để làm việc trên máy tính và ngày mai sẽ mở bình thường. Vì vậy học sinh có thể sử dụng IT Centre vào ngày mai.", "paraphrase": "open as usual tomorrow ↔ pupils can use the IT Centre tomorrow", "nextTimeFocus": "Đừng biến một sự kiện tạm thời thành thông tin ‘thường xuyên’. Chú ý time marker: today / tomorrow / usually.", "answer": "C"}, "3": {"distractors": ["B sai: Chris không hỏi mẹ đến đón hoặc cho đi nhờ xe.", "C sai: ‘left my key at home’ là để quên ở nhà, không phải làm mất chìa khóa."], "vocabulary": ["leave something at home = để quên thứ gì ở nhà", "get back from school = đi học về"], "cohesionChain": [], "correctDisplay": "A — Chris wants to know if his mum will be home later.", "relevantText": "Message from Chris to Mum: “I left my key at home this morning. Will you be in when I get back from school?”\nA. Chris wants to know if his mum will be home later.  B. Chris wants a lift back from school.  C. Chris has lost his door key.", "keyEvidence": "“Will you be in when I get back from school?”", "explanationVi": "Chris để quên chìa khóa ở nhà nên cậu cần biết mẹ có ở nhà khi cậu đi học về hay không. Câu hỏi trực tiếp ‘Will you be in…?’ khớp với đáp án A.", "paraphrase": "Will you be in when I get back? ↔ will be home later", "nextTimeFocus": "Phân biệt left at home với lost. Một từ gần nghĩa bề mặt có thể đổi hoàn toàn tình huống.", "answer": "A"}, "4": {"distractors": ["A sai: food không bị cấm hoàn toàn; refreshments vẫn được bán.", "C sai: refreshments ở ‘opposite the ticket office’, không phải ‘at the ticket office’."], "vocabulary": ["bring your own food = mang đồ ăn riêng", "refreshments = đồ ăn nhẹ và thức uống", "opposite = đối diện"], "cohesionChain": [], "correctDisplay": "B — You can only eat food bought at the cinema.", "relevantText": "Cinema notice: “Customers should not bring their own food into the cinema. Refreshments are available opposite the ticket office.”\nA. Food is not allowed in the cinema.  B. You can only eat food bought at the cinema.  C. Refreshments can be bought at the ticket office.", "keyEvidence": "“Customers should not bring their own food into the cinema. Refreshments are available opposite the ticket office.”", "explanationVi": "Thông báo cấm khách mang đồ ăn của riêng mình vào nhưng lại cho biết có bán đồ ăn/thức uống tại rạp. Vì vậy ý đúng là khách chỉ nên dùng đồ mua tại rạp.", "paraphrase": "should not bring their own food ↔ only eat food bought at the cinema", "nextTimeFocus": "Đọc giới từ và từ giới hạn thật kỹ. ‘Opposite’ không phải ‘at’; ‘no own food’ không đồng nghĩa ‘no food’.", "answer": "B"}, "5": {"distractors": ["B sai: John là người được khuyên mua, không phải người bán.", "C sai: người bán là ‘someone’, không phải nhà trường."], "vocabulary": ["noticeboard = bảng thông báo", "second-hand = đã qua sử dụng", "not as expensive = không đắt bằng"], "cohesionChain": [], "correctDisplay": "A — There’s a cheaper phone for sale on the noticeboard.", "relevantText": "Message from Mark to John: “Before you buy that mobile phone you were telling me about, have a look on the school noticeboard. Someone is selling a second-hand one that looks good and isn’t as expensive.”\nA. There’s a cheaper phone for sale on the noticeboard.  B. John can sell his phone on the school noticeboard.  C. The school is selling second-hand mobile phones.", "keyEvidence": "“Someone is selling a second-hand one that looks good and isn’t as expensive.”", "explanationVi": "Mark khuyên John xem bảng thông báo vì có một người đang bán điện thoại cũ rẻ hơn chiếc John định mua. Đó chính là ý của A.", "paraphrase": "isn’t as expensive ↔ cheaper; someone is selling ↔ for sale", "nextTimeFocus": "Xác định chính xác WHO is selling và WHO is buying; đừng suy từ địa điểm ‘school noticeboard’ thành ‘the school is selling’.", "answer": "A"}, "6": {"distractors": ["A có áo khoác nhưng nhấn mạnh giữ ấm, khô trong thời tiết lạnh/ướt, không phù hợp nhu cầu mùa hè và không nhắm tới người lớn tuổi.", "Các lựa chọn khác không đáp ứng đồng thời ‘something she can wear’ + ‘for her grandmother’ + ‘summer’."], "vocabulary": ["range of items = dòng/nhiều loại sản phẩm", "warmer weather = thời tiết ấm hơn", "older woman = phụ nữ lớn tuổi"], "cohesionChain": [], "correctDisplay": "D — Bliss Boutique", "relevantText": "Lotte is fourteen and wants to get a present for her grandmother. She wants to buy her something she can wear, and knows she needs new clothes for the summer.", "keyEvidence": "Bliss Boutique: “We have a new range of items for the older woman and a new selection for the warmer weather.”", "explanationVi": "Lotte có hai điều kiện bắt buộc: quà cho bà (older woman) và là đồ mặc phù hợp mùa hè (warmer weather). Bliss Boutique đáp ứng cả hai điều kiện cùng lúc.", "paraphrase": "grandmother ↔ older woman; summer ↔ warmer weather; something she can wear ↔ clothing/items", "nextTimeFocus": "Part 2: tách profile thành MUST-HAVE conditions rồi tìm option đáp ứng đủ tất cả, không match bằng một keyword.", "answer": "D"}, "7": {"distractors": ["H có science-fiction theme nhưng chủ yếu là posters/comics và merchandise; profile nhấn mạnh reading novels và stories based on films.", "Các option còn lại không liên quan sách science fiction."], "vocabulary": ["science fiction novel = tiểu thuyết khoa học viễn tưởng", "based on = dựa trên", "latest book = cuốn sách mới nhất"], "cohesionChain": [], "correctDisplay": "F — Beech’s Books", "relevantText": "Rob is twelve and is looking for a birthday present for his best friend. His friend loves reading science fiction novels, especially stories based on well-known films.", "keyEvidence": "Beech’s Books: “...the latest book from Andy Harrison, Countdown, an exciting adventure set in 2091 and based on the popular movie Alone in Space.”", "explanationVi": "Bạn của Rob thích science fiction novels và đặc biệt thích truyện dựa trên phim nổi tiếng. Beech’s Books có đúng một cuốn sách phiêu lưu khoa học viễn tưởng dựa trên một bộ phim nổi tiếng.", "paraphrase": "stories based on well-known films ↔ book ... based on the popular movie", "nextTimeFocus": "Khi hai option cùng có keyword ‘science fiction’, hãy kiểm điều kiện thứ hai: loại sản phẩm (novel/book) và ‘based on a film’.", "answer": "F"}, "8": {"distractors": ["Những nơi bán quần áo/sách/cây không đáp ứng ý ‘parents can share’ theo cách rõ ràng như đồ dùng chung trong nhà.", "Yếu tố ‘help to design’ được thể hiện bằng việc khách chọn item và thêm personal message."], "vocabulary": ["wedding anniversary = kỷ niệm ngày cưới", "personal message = lời nhắn cá nhân", "item to be completed = món đồ được hoàn thiện"], "cohesionChain": [], "correctDisplay": "G — Homefront", "relevantText": "Barbara is ten and it’s her mum and dad’s wedding anniversary in three weeks. She would like to get something she can help to design, and that her parents can share.", "keyEvidence": "Homefront: “Select one of our beautifully designed vases, pots, bowls or dishes and our artists will add your own personal message to the item you have chosen. Please allow 7 days for the item to be completed.”", "explanationVi": "Barbara cần một món quà cho cả bố mẹ dùng chung và muốn tham gia vào thiết kế. Homefront cho chọn đồ gia dụng dùng chung và thêm ‘your own personal message’, nên cô bé có thể góp phần cá nhân hóa. Thời gian hoàn thành 7 ngày cũng phù hợp với mốc ba tuần.", "paraphrase": "help to design ↔ add your own personal message; parents can share ↔ vases/pots/bowls/dishes for the home", "nextTimeFocus": "Ngoài nội dung chính, kiểm cả điều kiện thời gian. ‘In three weeks’ phải tương thích với thời gian hoàn thiện sản phẩm.", "answer": "G"}, "9": {"distractors": ["D có clothing nhưng mô tả seasonal style/older women, không nhấn mạnh chống mưa.", "Các nơi khác không bán jacket phù hợp điều kiện thời tiết."], "vocabulary": ["discount = giảm giá", "guaranteed = được đảm bảo", "keep you warm and dry = giữ ấm và khô ráo"], "cohesionChain": [], "correctDisplay": "A — Mayfield Outdoor Stores", "relevantText": "Stuart is fifteen years old and wants to buy himself a jacket using the money he received for his birthday. He wants something he can wear to watch football when it is raining.", "keyEvidence": "Mayfield Outdoor Stores: “...50% discount on all our men’s and women’s jackets — guaranteed to keep you warm and dry on the coldest and wettest of days.”", "explanationVi": "Stuart cần jacket và phải dùng được khi trời mưa. Mayfield bán jacket, đang giảm giá và đặc biệt cam kết giữ người mặc ‘warm and dry’ trong những ngày ướt nhất.", "paraphrase": "when it is raining ↔ wettest days; wear ... jacket ↔ men’s jackets; using birthday money ↔ 50% discount helps affordability", "nextTimeFocus": "Part 2 thường có một option gần đúng về loại sản phẩm. Hãy kiểm thêm điều kiện sử dụng thực tế: ở đây là rain/wet weather.", "answer": "A"}, "10": {"distractors": ["E cũng bán cây nhưng nhấn mạnh fruit bushes và young trees cho garden/growing season; ít phù hợp hơn với flat + balcony.", "Các lựa chọn khác không đáp ứng sở thích plants/flowers."], "vocabulary": ["pick up = mua/lấy", "small spaces = không gian nhỏ", "growing flowers = trồng hoa"], "cohesionChain": [], "correctDisplay": "C — St Matthew’s Centre", "relevantText": "Ruth, who is twelve, would like to buy her dance teacher a present to say thank you for her help. Her teacher likes plants and flowers and lives in a flat with a balcony.", "keyEvidence": "St Matthew’s Centre: “You can also pick up some plants for the garden or buy our new book by a local author on growing flowers in small spaces.”", "explanationVi": "Ruth cần quà liên quan đến plants/flowers cho người sống trong flat có balcony, tức không gian nhỏ. St Matthew’s vừa có plants vừa có sách về trồng hoa trong ‘small spaces’, phù hợp rõ nhất.", "paraphrase": "flat with a balcony ↔ small spaces; likes plants and flowers ↔ plants / growing flowers", "nextTimeFocus": "Khi hai option cùng có ‘plants’, dùng điều kiện môi trường sống để phân biệt: balcony/small space khác garden lớn.", "answer": "C"}, "11": {"distractors": ["A sai: gia đình đang cân nhắc chuyển sang sống ở Spain hoặc chỉ sang thăm bố vào kỳ nghỉ; Tara chọn chuyển đi, không phải chỉ mong chờ kỳ nghỉ.", "C sai: cô lo phải rời bạn nhưng vẫn thấy khí hậu nắng ấm hấp dẫn và đồng ý chuyển.", "D sai: text nói ‘having visits from Dad occasionally’, không nói cô nhớ lại những kỳ nghỉ đã từng ở Spain."], "vocabulary": ["settle = định cư", "vote to do something = bỏ phiếu/chọn làm việc gì", "sunny climate = khí hậu nhiều nắng"], "cohesionChain": [], "correctDisplay": "B — she agreed with the decision to move.", "relevantText": "When Tara first heard about her dad’s job in Spain, ...\nA. she looked forward to spending holidays there.  B. she agreed with the decision to move.  C. she didn’t think it was worth leaving her friends for a sunny climate.  D. she thought about the times they had spent there on holiday.", "keyEvidence": "“Although I was worried about having to leave my friends and change schools, the thought of living in a sunny climate was certainly exciting to me, and along with my mum and brother, I voted to move to Spain.”", "explanationVi": "Tara có lo lắng, nhưng cô vẫn thấy việc sống ở khí hậu nắng ấm hấp dẫn và cuối cùng ‘voted to move to Spain’. Điều này trực tiếp cho thấy cô đồng ý với quyết định chuyển đi.", "paraphrase": "voted to move to Spain ↔ agreed with the decision to move", "nextTimeFocus": "Với câu hỏi về attitude/decision, hãy tìm câu kết luận hành động cuối cùng, không dừng ở cảm xúc lo lắng ban đầu.", "answer": "B"}, "12": {"distractors": ["A sai về thời điểm: teacher đã giải thích school system trong chuyến thăm một tuần trước khi trường bắt đầu.", "B sai: Tara đã gặp teacher trước đó một tuần.", "C sai: cô nói mình có thể giao tiếp Spanish hằng ngày; không có thông tin tham gia conversation class."], "vocabulary": ["look forward to = mong chờ", "strangers = người lạ", "give me a stomach ache = làm tôi đau bụng (do lo lắng)"], "cohesionChain": [], "correctDisplay": "D — She felt nervous about meeting new people.", "relevantText": "What does Tara say about her first day at a Spanish school?\nA. The teacher told her about the school system.  B. She met her teacher for the first time.  C. She joined a Spanish conversation class.  D. She felt nervous about meeting new people.", "keyEvidence": "“But the thought of joining a class full of strangers was enough to give me a stomach ache on the first day.”", "explanationVi": "‘A class full of strangers’ làm Tara đau bụng vì lo. Đây là biểu hiện rõ của sự hồi hộp khi gặp người mới, nên D đúng.", "paraphrase": "class full of strangers / stomach ache ↔ felt nervous about meeting new people", "nextTimeFocus": "Chú ý time marker. Thông tin có thật nhưng xảy ra ‘the week before’ là distractor cho câu hỏi ‘first day’.", "answer": "D"}, "13": {"distractors": ["A sai: friends nghĩ cô chưa từng ăn các món đó, nhưng text không xác nhận điều này là thật.", "B sai: bạn bè tự nguyện giải thích; Tara không yêu cầu giúp.", "D sai: ‘explain each dish in detail’ không có nghĩa menu được viết chi tiết; và câu hỏi nói lunchtime, không dinner."], "vocabulary": ["nevertheless = tuy vậy", "be keen to = rất sẵn lòng/hứng thú làm", "in detail = chi tiết"], "cohesionChain": [], "correctDisplay": "C — She didn’t need help to decide what to eat.", "relevantText": "What does Tara say about lunchtime?\nA. She saw food she had never eaten before.  B. She asked the Spanish students to help her with the menu.  C. She didn’t need help to decide what to eat.  D. The dinner menu was very detailed.", "keyEvidence": "“Choosing what to eat at lunchtime was never going to be a problem as I loved Spanish food, but my new friends were nevertheless keen to explain each dish in detail as they thought I hadn’t eaten them before.”", "explanationVi": "Tara nói rõ việc chọn món ‘was never going to be a problem’ vì cô thích đồ ăn Tây Ban Nha. Bạn bè chủ động giải thích món ăn vì họ nghĩ cô chưa từng ăn, chứ Tara không cần họ giúp chọn.", "paraphrase": "was never going to be a problem ↔ didn’t need help to decide", "nextTimeFocus": "Phân biệt điều nhân vật khác nghĩ với điều narrator xác nhận. ‘They thought...’ không tự động trở thành sự thật.", "answer": "C"}, "14": {"distractors": ["A sai: cô nói mình dành vài tuần để ‘getting used to’ cuộc sống ở trường Spanish, nhưng không nói school system là khó.", "C sai: friends helped when needed; không nói họ làm hộ homework.", "D sai: không có thông tin nộp bài muộn."], "vocabulary": ["get used to = quen với", "a challenge = điều khó khăn/thử thách", "eager to help = rất sẵn lòng giúp"], "cohesionChain": [], "correctDisplay": "B — her lack of Spanish meant homework could be difficult.", "relevantText": "During her first few weeks at the school, ...\nA. she found it hard getting used to the Spanish school system.  B. her lack of Spanish meant homework could be difficult.  C. her friends did her homework for her.  D. she was late handing in homework.", "keyEvidence": "“My level of Spanish was OK, though understanding the homework was sometimes a challenge, but they were always eager to help me when I needed it.”", "explanationVi": "Tara nói Spanish của mình chỉ ở mức OK và ‘understanding the homework was sometimes a challenge’. Vì vậy việc hiểu bài tập đôi khi khó do hạn chế ngôn ngữ.", "paraphrase": "understanding the homework was sometimes a challenge ↔ homework could be difficult", "nextTimeFocus": "Đừng nâng mức nghĩa của ‘help’ thành ‘do the homework for her’. PET thường kiểm tra việc option phóng đại thông tin.", "answer": "B"}, "15": {"distractors": ["B trái với trải nghiệm của Tara: cô kết bạn khá nhanh ở cả Spain và England.", "C sai: Tara ‘voted to move to Spain’, không bị ép làm trái ý.", "D quá hẹp và không phải bài học chính; cô nhấn mạnh bạn bè giúp đối mặt thay đổi nói chung."], "vocabulary": ["needn’t have worried = đã không cần phải lo", "deal with big changes = đối phó với thay đổi lớn", "make challenges easier = làm thử thách dễ hơn"], "cohesionChain": [], "correctDisplay": "A — Things are sometimes not as worrying as we imagine.", "relevantText": "What would Tara be likely to say?\nA. Things are sometimes not as worrying as we imagine.  B. Good friends are hard to find.  C. I don’t like doing things against my wishes.  D. It can be difficult to get used to a different education system.", "keyEvidence": "“However, I needn’t have worried.” ... “friends ... can help you deal with big changes in your life and make any challenges you face so much easier.”", "explanationVi": "Toàn bài cho thấy Tara lo lắng về thay đổi và ngày đầu tiên, nhưng thực tế mọi chuyện dễ hơn nhờ bạn bè. Câu tổng kết phù hợp nhất là đôi khi sự việc không đáng lo như ta tưởng.", "paraphrase": "I needn’t have worried ↔ not as worrying as we imagine; make challenges easier ↔ things can be less difficult than expected", "nextTimeFocus": "Câu hỏi tổng kết/inference cần nhìn toàn bài, đặc biệt đoạn kết và thông điệp lặp lại, không chỉ một chi tiết.", "answer": "A"}, "16": {"distractors": ["Các câu khác không có reference phù hợp với ‘my friends’ và không dẫn tự nhiên sang ý ‘I’d find it difficult ... without music’."], "vocabulary": ["be keen on = rất thích", "even more = thậm chí còn hơn", "without the chance to = nếu không có cơ hội để"], "cohesionChain": [], "correctDisplay": "F — However, I think I’m even more keen than they are.", "relevantText": "Gap 16 in ‘My Love of Music’. Choose from sentences A–H.", "keyEvidence": "Before: “My friends and I are always talking about the latest song we’re in love with and which singers or groups we’re currently keen on.”\nInserted: “However, I think I’m even more keen than they are.”\nAfter: “I honestly think I’d find it difficult to do many of the things I do without the chance to listen to music.”", "explanationVi": "‘They’ trong F quay lại ‘my friends’. ‘However’ tạo chuyển ý: bạn bè đều thích âm nhạc, nhưng người viết còn say mê hơn họ. Câu sau phát triển mức độ yêu âm nhạc rất mạnh của người viết.", "cohesionMap": {"BEFORE GAP": "My friends and I ... singers or groups we’re currently keen on.", "INSERTED SENTENCE": "However, I think I’m even more keen than they are.", "AFTER GAP": "I honestly think I’d find it difficult ... without the chance to listen to music."}, "paraphrase": "keen on music ↔ love listening to music", "nextTimeFocus": "Part 4: kiểm pronoun trước tiên. ‘They’ phải có antecedent rõ ràng ngay trước gap.", "answer": "F"}, "17": {"distractors": ["A nói before sleep, thuộc đoạn cuối chứ không phải journey.", "Các câu về running/studying không tạo được lexical chain với traffic/bus."], "vocabulary": ["during the journey = trong chuyến đi", "traffic jams = tắc đường", "catch up with the latest news = cập nhật tin tức mới nhất"], "cohesionChain": [], "correctDisplay": "B — I always have my headphones on during the journey to school.", "relevantText": "Gap 17 in ‘My Love of Music’. Choose from sentences A–H.", "keyEvidence": "Before: end of paragraph about needing music.\nInserted: “I always have my headphones on during the journey to school.”\nAfter: “I try to leave early in case there are traffic jams, but as I sit on the bus, I find myself relaxing...”", "explanationVi": "B giới thiệu bối cảnh ‘journey to school’. Câu sau tiếp tục trực tiếp bằng việc rời nhà sớm, gặp traffic jams và ngồi trên bus. Chuỗi ngữ nghĩa journey → traffic → bus liền mạch.", "cohesionMap": {"BEFORE GAP": "General statement that music is important in daily activities.", "INSERTED SENTENCE": "I always have my headphones on during the journey to school.", "AFTER GAP": "I try to leave early ... traffic jams ... as I sit on the bus..."}, "nextTimeFocus": "Tìm lexical chain. journey → traffic jams → bus là chuỗi rất mạnh, mạnh hơn việc chỉ thấy keyword ‘music’.", "answer": "B"}, "18": {"distractors": ["E ‘However, it’s also a great way to keep fit’ nói về running nhưng không tạo reference cho ‘This isn’t about relaxing...’ rõ bằng H.", "Các option khác không giới thiệu một ‘benefit’ để ‘This’ tham chiếu."], "vocabulary": ["benefit = lợi ích", "focus on = tập trung vào", "in the background = ở nền/phía sau"], "cohesionChain": [], "correctDisplay": "H — Music offers a different benefit this time.", "relevantText": "Gap 18 in ‘My Love of Music’. Choose from sentences A–H.", "keyEvidence": "Before: “I also find it much more enjoyable to go running when I’m listening to music.”\nInserted: “Music offers a different benefit this time.”\nAfter: “This isn’t about relaxing but about helping me to focus on the speed I’m going.”", "explanationVi": "‘This’ ở câu sau phải quay lại ‘a different benefit’. Người viết đối chiếu lợi ích của nhạc khi chạy với lợi ích thư giãn ở đoạn trước: lần này âm nhạc giúp tập trung vào tốc độ.", "cohesionMap": {"BEFORE GAP": "Running is more enjoyable with music.", "INSERTED SENTENCE": "Music offers a different benefit this time.", "AFTER GAP": "This isn’t about relaxing but about helping me to focus on the speed..."}, "paraphrase": "different benefit ↔ helping me to focus on speed", "nextTimeFocus": "Đọc cả câu sau gap. Reference word ‘This’ thường là khóa để loại các câu chỉ hợp phía trước.", "answer": "H"}, "19": {"distractors": ["C ‘I don’t like pop music’ mâu thuẫn với ý người viết thích nghe nhiều loại nhạc (‘as wide a range ... as possible’).", "Các câu khác không nối được ‘classical music’ + ‘studying’."], "vocabulary": ["prefer A to B = thích A hơn B", "concentrate on = tập trung vào", "a wide range of = nhiều loại đa dạng"], "cohesionChain": [], "correctDisplay": "D — I prefer this to pop music when I’m studying.", "relevantText": "Gap 19 in ‘My Love of Music’. Choose from sentences A–H.", "keyEvidence": "Before: “This is when I like to listen to classical music on my headphones as I work.”\nInserted: “I prefer this to pop music when I’m studying.”\nAfter: “I can not only concentrate on what I have to do, but I also think it’s good to listen to as wide a range of music as possible.”", "explanationVi": "‘This’ trong D tham chiếu trực tiếp đến classical music. ‘when I’m studying’ nối với ‘as I work’, rồi câu sau giải thích lợi ích concentration và việc nghe nhiều loại nhạc.", "cohesionMap": {"BEFORE GAP": "I like to listen to classical music ... as I work.", "INSERTED SENTENCE": "I prefer this to pop music when I’m studying.", "AFTER GAP": "I can not only concentrate ... but ... listen to as wide a range of music as possible."}, "nextTimeFocus": "Khi option có ‘this’, xác định chính xác danh từ/ý ngay trước nó. Đồng thời kiểm câu sau có tiếp tục cùng chủ đề không.", "answer": "D"}, "20": {"distractors": ["G ‘That’s when I turn my phone off’ có vẻ hợp ‘one time’, nhưng câu sau ‘But I always ended up staying awake too long’ cần một thói quen trước đây gây mất ngủ; A cung cấp nguyên nhân đó.", "Các option về school/running/studying không phù hợp bedtime context."], "vocabulary": ["used to + V = từng làm gì trong quá khứ", "end up + V-ing = cuối cùng lại", "stay awake = thức"], "cohesionChain": [], "correctDisplay": "A — I used to watch online music videos before I went to sleep.", "relevantText": "Gap 20 in ‘My Love of Music’. Choose from sentences A–H.", "keyEvidence": "Before: “There is one time, though, when I don’t listen to music.”\nInserted: “I used to watch online music videos before I went to sleep.”\nAfter: “But I always ended up staying awake too long and felt tired in the morning.”", "explanationVi": "A nói về thói quen cũ trước khi ngủ. ‘But I always ended up staying awake too long’ giải thích hậu quả khiến người viết giờ không nghe/xem nhạc vào thời điểm đó nữa. Cặp used to + but + consequence rất logic.", "cohesionMap": {"BEFORE GAP": "There is one time ... when I don’t listen to music.", "INSERTED SENTENCE": "I used to watch online music videos before I went to sleep.", "AFTER GAP": "But I always ended up staying awake too long and felt tired in the morning."}, "grammarPoint": "used to watch diễn tả thói quen quá khứ không còn duy trì; ‘But’ mở ra kết quả tiêu cực của thói quen đó.", "nextTimeFocus": "Part 4 không chỉ là pronoun. Quan hệ thời gian/chronology (used to → consequence → now change) cũng là cohesion chain mạnh.", "answer": "A"}, "21": {"distractors": ["borders of the world không tự nhiên về nghĩa; spaces of the world không phải collocation thông dụng; distances of the world sai nghĩa."], "vocabulary": ["parts of the world = các khu vực trên thế giới", "form of transport = phương tiện/hình thức vận chuyển"], "cohesionChain": [], "correctDisplay": "C — parts", "relevantText": "Camels have been used ... as a form of transport in (21) ______ of the world where other animals would find it hard to live.\nA borders  B spaces  C parts  D distances", "keyEvidence": "“in parts of the world”", "explanationVi": "Cụm tự nhiên và đúng nghĩa là ‘parts of the world’ = các khu vực trên thế giới. Ba từ còn lại không tạo collocation phù hợp với ‘of the world’ trong câu này.", "grammarPoint": "Lexical collocation: part(s) of the world.", "nextTimeFocus": "Part 5: thử đọc cả cụm cố định quanh gap, không dịch từng từ rời.", "answer": "C"}, "22": {"distractors": ["keep = giữ; contain = chứa bên trong; take có nhiều nghĩa nhưng không tự nhiên với nghĩa mang tải như câu này."], "vocabulary": ["carry weight = mang trọng lượng/tải", "racehorse = ngựa đua"], "cohesionChain": [], "correctDisplay": "A — carry", "relevantText": "They can run as fast as a racehorse and can (22) ______ between 170–270 kilograms.\nA carry  B keep  C contain  D take", "keyEvidence": "“can carry between 170–270 kilograms”", "explanationVi": "Camels có thể mang một trọng lượng 170–270 kg. Động từ đúng cho ‘mang tải/trọng lượng’ là carry.", "grammarPoint": "Modal can + base verb: can carry.", "nextTimeFocus": "So sánh nghĩa động từ trong đúng collocation với object ‘kilograms/weight’.", "answer": "A"}, "23": {"distractors": ["heat không đi tự nhiên với ‘hot, dry’; degrees cần số đo; forecast là dự báo thời tiết, không phải điều kiện lâu dài."], "vocabulary": ["hot, dry climate = khí hậu nóng, khô", "be suited to = phù hợp/thích nghi với"], "cohesionChain": [], "correctDisplay": "D — climate", "relevantText": "...they have become very well suited to the hot, dry (23) ______ of the desert.\nA heat  B degrees  C forecast  D climate", "keyEvidence": "“the hot, dry climate of the desert”", "explanationVi": "‘Hot, dry climate’ là cụm mô tả điều kiện thời tiết điển hình kéo dài của sa mạc. climate phù hợp cả nghĩa lẫn collocation.", "grammarPoint": "Adjectives hot, dry modify the noun climate.", "nextTimeFocus": "Phân biệt climate (đặc điểm dài hạn) với forecast (dự báo).", "answer": "D"}, "24": {"distractors": ["lots thường cần ‘lots of + noun’, không dùng ‘huge lots’ ở đây; numbers dùng với danh từ đếm được; totals không phù hợp nghĩa."], "vocabulary": ["huge amounts = lượng rất lớn", "amount of water = lượng nước"], "cohesionChain": [], "correctDisplay": "A — amounts", "relevantText": "When they find water, they can drink huge (24) ______.\nA amounts  B lots  C numbers  D totals", "keyEvidence": "“drink huge amounts”", "explanationVi": "‘Amounts’ dùng với lượng của danh từ không đếm được như water; ‘huge amounts’ là collocation tự nhiên.", "grammarPoint": "amount(s) dùng cho lượng của uncountable nouns; water là uncountable.", "nextTimeFocus": "Nhìn danh từ được hiểu ngầm sau gap. Countability thường quyết định đáp án Part 5.", "answer": "A"}, "25": {"distractors": ["short to find / bad to find / weak to find đều không tạo cấu trúc tự nhiên."], "vocabulary": ["hard to find = khó tìm", "store fat = tích trữ mỡ", "hump = bướu lạc đà"], "cohesionChain": [], "correctDisplay": "B — hard", "relevantText": "The hump ... is used to store fat that they need when food is (25) ______ to find.\nA short  B hard  C bad  D weak", "keyEvidence": "“when food is hard to find”", "explanationVi": "Cấu trúc cố định ‘be hard to find’ = khó tìm. Ý nghĩa phù hợp hoàn toàn với việc lạc đà tích trữ mỡ khi thức ăn khan hiếm.", "grammarPoint": "be + adjective + to-infinitive: food is hard to find.", "nextTimeFocus": "Nhận ra pattern ngữ pháp quanh gap trước khi so nghĩa từng option.", "answer": "B"}, "26": {"distractors": ["hold them against = giữ họ áp vào; stop them against không đúng cấu trúc; save thường dùng save someone from danger nhưng không tự nhiên bằng protect ... against trong mô tả chức năng."], "vocabulary": ["protect ... against = bảo vệ ... khỏi", "sandstorm = bão cát", "eyelashes = lông mi"], "cohesionChain": [], "correctDisplay": "C — protect", "relevantText": "They have extra-thick skin and rows of eyelashes around their eyes, which (26) ______ them against sandstorms.\nA hold  B stop  C protect  D save", "keyEvidence": "“protect them against sandstorms”", "explanationVi": "Collocation chuẩn là ‘protect someone/something against/from something’. Eyelashes bảo vệ mắt/lạc đà khỏi bão cát.", "grammarPoint": "Relative clause: which protect them against sandstorms; antecedent là extra-thick skin and rows of eyelashes.", "nextTimeFocus": "Dependent preposition là tín hiệu mạnh: protect + against/from.", "answer": "C"}, "27": {"distractors": [], "vocabulary": ["live with a family = sống cùng một gia đình", "in the UK = ở Vương quốc Anh"], "cohesionChain": [], "correctDisplay": "in", "relevantText": "Something I often ate when I lived with a family (27) ______ the UK was a jacket potato.", "keyEvidence": "“with a family in the UK”", "explanationVi": "Cần giới từ chỉ địa điểm trước tên quốc gia: in the UK.", "grammarPoint": "Preposition of place: in + country/region.", "nextTimeFocus": "Nhìn ngay noun phrase sau gap. Country names thường đi với in.", "answer": "in"}, "28": {"distractors": [], "vocabulary": ["be eaten = được ăn", "anywhere else = ở nơi nào khác"], "cohesionChain": [], "correctDisplay": "are", "relevantText": "I’m not sure whether this is where they were invented or if they (28) ______ eaten anywhere else...", "keyEvidence": "“if they are eaten anywhere else”", "explanationVi": "‘They’ = jacket potatoes. Câu cần passive voice ở hiện tại: are eaten = được ăn. ‘Were invented’ nói nguồn gốc quá khứ, còn ‘are eaten anywhere else’ nói việc người ta ăn chúng hiện nay.", "grammarPoint": "Present simple passive: they are eaten.", "nextTimeFocus": "Nếu sau gap là past participle ‘eaten’, hãy nghĩ đến auxiliary của passive voice.", "answer": "are"}, "29": {"distractors": [], "vocabulary": ["be called = được gọi là", "in their skin = còn nguyên vỏ"], "cohesionChain": [], "correctDisplay": "the", "relevantText": "They’re called ‘jacket potatoes’ because (29) ______ potatoes are cooked in their skin.", "keyEvidence": "“because the potatoes are cooked in their skin”", "explanationVi": "Người viết đang nói lại về những jacket potatoes vừa được nhắc tới, nên dùng definite article ‘the’ để chỉ nhóm cụ thể đó.", "grammarPoint": "Definite article the dùng khi danh từ đã được xác định trong ngữ cảnh.", "nextTimeFocus": "Open cloze thường kiểm article. Hỏi: danh từ đang nói chung hay đã xác định?", "answer": "the"}, "30": {"distractors": [], "vocabulary": ["bake in the oven = nướng trong lò", "quite a long time = khá lâu", "fluffy = mềm xốp"], "cohesionChain": [], "correctDisplay": "for", "relevantText": "You usually bake them in the oven (30) ______ quite a long time so the inside is nice and fluffy.", "keyEvidence": "“for quite a long time”", "explanationVi": "‘For’ dùng với khoảng thời gian: for quite a long time.", "grammarPoint": "for + duration; since + starting point.", "nextTimeFocus": "Khi sau gap là một khoảng thời gian, ưu tiên kiểm for/since.", "answer": "for"}, "31": {"distractors": [], "vocabulary": ["apart from = ngoài việc/bên cạnh", "easy to cook = dễ nấu"], "cohesionChain": [], "correctDisplay": "being", "relevantText": "Apart from (31) ______ easy to cook, people also say they are healthy.", "keyEvidence": "“Apart from being easy to cook”", "explanationVi": "Sau preposition phrase ‘apart from’ cần noun hoặc V-ing. Vì câu mô tả trạng thái ‘easy to cook’, ta dùng being.", "grammarPoint": "Preposition + V-ing: apart from being ...", "nextTimeFocus": "Sau giới từ, động từ thường chuyển sang -ing form.", "answer": "being"}, "32": {"distractors": [], "vocabulary": ["be careful about = cẩn thận về", "put on top = cho/đặt lên trên"], "cohesionChain": [], "correctDisplay": "what", "relevantText": "...if you’re careful about (32) ______ you put on top, it can be good for you.", "keyEvidence": "“careful about what you put on top”", "explanationVi": "Cần một từ nối mang nghĩa ‘những gì/thứ mà bạn cho lên trên’. ‘what’ vừa làm connector vừa làm object của ‘put’.", "grammarPoint": "Noun clause: what you put on top = the thing(s) that you put on top.", "nextTimeFocus": "Nếu gap mở đầu một mệnh đề danh từ và thiếu object, ‘what’ là lựa chọn quan trọng cần kiểm.", "answer": "what"}}, "part1": [{"n": 1, "style": "email", "source": {"to": "Alison", "from": "Cristine", "body": "Hi Alison\n\nI’ve caught a cold and don’t feel well at all. Can you apologise to your mum for me and tell her as soon as possible that I can’t come for dinner?\n\nCristine"}, "options": {"A": "Alison should apologise to her mum.", "B": "Alison isn’t feeling hungry.", "C": "Cristine should speak to her mum quickly."}}, {"n": 2, "style": "notice", "title": "IT Centre", "sourceText": "We will close earlier today at 4.30 to carry out work on the computers.\nWe will open as usual tomorrow.", "options": {"A": "The computers in the IT Centre aren’t working.", "B": "The IT Centre usually closes at 4.30.", "C": "Pupils can use the IT Centre tomorrow."}}, {"n": 3, "style": "phone", "sourceText": "Mum\n\nI left my key at home this morning. Will you be in when I get back from school?\n\nChris", "options": {"A": "Chris wants to know if his mum will be home later.", "B": "Chris wants a lift back from school.", "C": "Chris has lost his door key."}}, {"n": 4, "style": "notice", "sourceText": "Customers should not bring their own food into the cinema.\nRefreshments are available opposite the ticket office.", "options": {"A": "Food is not allowed in the cinema.", "B": "You can only eat food bought at the cinema.", "C": "Refreshments can be bought at the ticket office."}}, {"n": 5, "style": "email", "source": {"to": "John", "from": "Mark", "body": "Hi John\n\nBefore you buy that mobile phone you were telling me about, have a look on the school noticeboard. Someone is selling a second-hand one that looks good and isn’t as expensive.\n\nMark"}, "options": {"A": "There’s a cheaper phone for sale on the noticeboard.", "B": "John can sell his phone on the school noticeboard.", "C": "The school is selling second-hand mobile phones."}}], "part2Profiles": {"6": "Lotte is fourteen and wants to get a present for her grandmother. She wants to buy her something she can wear, and knows she needs new clothes for the summer.", "7": "Rob is twelve and is looking for a birthday present for his best friend. His friend loves reading science fiction novels, especially stories based on well-known films.", "8": "Barbara is ten and it’s her mum and dad’s wedding anniversary in three weeks. She would like to get something she can help to design, and that her parents can share.", "9": "Stuart is fifteen years old and wants to buy himself a jacket using the money he received for his birthday. He wants something he can wear to watch football when it is raining.", "10": "Ruth, who is twelve, would like to buy her dance teacher a present to say thank you for her help. Her teacher likes plants and flowers and lives in a flat with a balcony."}, "part2Bank": {"A": {"title": "Mayfield Outdoor Stores", "text": "We are well known for providing top-quality clothing for people who like spending time outdoors, in any weather. We have a sale this weekend and are offering 50% discount on all our men’s and women’s jackets — guaranteed to keep you warm and dry on the coldest and wettest of days."}, "B": {"title": "Street Market", "text": "Our popular street market takes place next month, and we’re looking for anyone who has any books they would like to give away for our charity stall. We are interested in all different kinds, from science fiction to romance. Sadly, we can’t pay you for your donation, but all the money we make will go to a charity."}, "C": {"title": "St Matthew’s Centre", "text": "Come along to the St Matthew’s Centre this Saturday and see what’s on offer. We have a small selection of stalls selling fruit and vegetables. You can also pick up some plants for the garden or buy our new book by a local author on growing flowers in small spaces. Our staff are always available to offer advice."}, "D": {"title": "Bliss Boutique", "text": "Getting old doesn’t mean you can’t be stylish. In fact, we’ll help you look your very best this holiday season. We have a new range of items for the older woman and a new selection for the warmer weather. We also have a range of gift cards available for those who want a present for a friend or relative."}, "E": {"title": "Mattock Garden Centre", "text": "With spring just around the corner, now is the time to start getting ready for the growing season. We have all you need for the garden, including a variety of fruit bushes and young trees to plant out now the cold weather has passed."}, "F": {"title": "Beech’s Books", "text": "Come along to Beech’s Books this weekend for the widest selection of titles. From bestsellers to historical novels, we cover everything from A–Z, and this Saturday we are promoting the latest book from Andy Harrison, Countdown, an exciting adventure set in 2091 and based on the popular movie Alone in Space."}, "G": {"title": "Homefront", "text": "Having trouble thinking of what to buy for a friend or relation? Now’s your chance to get the perfect present for someone you love. Select one of our beautifully designed vases, pots, bowls or dishes and our artists will add your own personal message to the item you have chosen. Please allow 7 days for the item to be completed."}, "H": {"title": "CBT Online Tech", "text": "To all you science fiction fans out there, don’t miss our sale this weekend. All our posters will be at half price. As well as being able to pick up a copy of that special film while you’re here, see our wide range of comics featuring all your favourite superheroes."}}, "part3Text": ["Three years ago, my father was offered a wonderful job in Spain. My family spent hours discussing whether we should move out to Spain with him or settle for having visits from Dad occasionally, when he had holidays. Although I was worried about having to leave my friends and change schools, the thought of living in a sunny climate was certainly exciting to me, and along with my mum and brother, I voted to move to Spain.", "I wasn’t looking forward to my first day at school in Madrid. I’d spent a few years learning Spanish at school and could manage in everyday conversations. I’d also met my new teacher on a visit the week before school started, and she’d explained the system in the school and what to expect. But the thought of joining a class full of strangers was enough to give me a stomach ache on the first day.", "However, I needn’t have worried. The teacher introduced me to my classmates and at the end of the lesson some of them walked with me to the school café and introduced themselves. Choosing what to eat at lunchtime was never going to be a problem as I loved Spanish food, but my new friends were nevertheless keen to explain each dish in detail as they thought I hadn’t eaten them before.", "The next few weeks were spent getting used to the way of life in a Spanish school and making close friends with a couple of girls, Ana and Sofia. We got on really well and would often spend time together after school. My level of Spanish was OK, though understanding the homework was sometimes a challenge, but they were always eager to help me when I needed it.", "We returned to England last year and I really missed my Spanish friends and the Spanish way of life. It wasn’t that I wanted to be back in Spain. I returned to my old school and loved catching up with my old friends. But I think the lesson I had learned was that friends are the same wherever you make them, and they can help you deal with big changes in your life and make any challenges you face so much easier."], "part3Questions": {"11": {"stem": "When Tara first heard about her dad’s job in Spain,", "options": {"A": "she looked forward to spending holidays there.", "B": "she agreed with the decision to move.", "C": "she didn’t think it was worth leaving her friends for a sunny climate.", "D": "she thought about the times they had spent there on holiday."}, "evidenceP": 0}, "12": {"stem": "What does Tara say about her first day at a Spanish school?", "options": {"A": "The teacher told her about the school system.", "B": "She met her teacher for the first time.", "C": "She joined a Spanish conversation class.", "D": "She felt nervous about meeting new people."}, "evidenceP": 1}, "13": {"stem": "What does Tara say about lunchtime?", "options": {"A": "She saw food she had never eaten before.", "B": "She asked the Spanish students to help her with the menu.", "C": "She didn’t need help to decide what to eat.", "D": "The dinner menu was very detailed."}, "evidenceP": 2}, "14": {"ste const NS='PET_READING_'+TEST.id+'_v'+TEST.schemaVersion;

let state={student:'',mode:null,durationMin:null,startTime:null,endTime:null,submitted:false,submitTime:null,answers:{},flags:{},currentPart:1,currentQ:1,result:null,retry:null};
let timerId=null; let activeReviewFilter='all';
function save(){try{localStorage.setItem(NS,JSON.stringify(state)); updateSaveChip();}catch(e){toast('Không thể lưu localStorage. Bài làm vẫn được giữ trên trang hiện tại.')}}
function load(){try{const raw=localStorage.getItem(NS);if(raw){const s=JSON.parse(raw);state={...state,...s,answers:s.answers||{},flags:s.flags||{}}}}catch(e){}}
function reset(){if(confirm('Bạn có chắc muốn xóa toàn bộ bài làm Test 1 và bắt đầu lại?')){localStorage.removeItem(NS);location.reload()}}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2400)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function status(q){const a=state.answers[q];return a!==undefined&&String(a).trim()!==''?'answered':'unanswered'}
function answeredCount(){return Object.keys(state.answers).filter(q=>String(state.answers[q]).trim()!=='').length}
function partOf(q){q=+q;if(q<=5)return 1;if(q<=10)return 2;if(q<=15)return 3;if(q<=20)return 4;if(q<=26)return 5;return 6}
function partRange(p){return p===1?[1,5]:p===2?[6,10]:p===3?[11,15]:p===4?[16,20]:p===5?[21,26]:[27,32]}
function normText(s){return String(s??'').trim().replace(/\s+/g,' ').toLowerCase()}
function isCorrect(q,ans){const key=TEST.answers[q];if(q>=27)return normText(ans)===normText(key);return ans===key}
function scoreAttempt(answers){let correct=0,incorrect=0,blank=0;const perPart={};for(let p=1;p<=6;p++)perPart[p]={correct:0,total:0};for(let q=1;q<=32;q++){const a=answers[q];perPart[partOf(q)].total++;if(a===undefined||String(a).trim()===''){blank++;continue}if(isCorrect(q,a)){correct++;perPart[partOf(q)].correct++}else incorrect++}return{correct,incorrect,blank,total:32,accuracy:Math.round(correct/32*100),perPart}}
function formatTime(ms){if(ms==null)return '—';const s=Math.max(0,Math.floor(ms/1000)),m=Math.floor(s/60),r=s%60;return `${m}:${String(r).padStart(2,'0')}`}
function elapsedMs(){if(!state.startTime)return 0;const end=state.submitted?state.submitTime:Date.now();return Math.max(0,end-state.startTime)}
function remainingMs(){return state.endTime?Math.max(0,state.endTime-Date.now()):null}
function updateClock(){const el=document.getElementById('clockChip');if(!el)return;if(state.mode==='timed'){const r=remainingMs();el.textContent='⏱ '+formatTime(r);if(r<=0&&!state.submitted)submit(true)}else el.textContent='⏱ '+formatTime(elapsedMs())}
function startTimer(){clearInterval(timerId);updateClock();timerId=setInterval(updateClock,1000)}
function updateSaveChip(){const el=document.getElementById('saveChip');if(el)el.textContent='Đã lưu'}
function showStart(){
 app.innerHTML=`<main class="start-wrap"><section class="start-card"><div class="eyebrow">PET Smart Practice • Reading</div><h1>B1 Preliminary Reading<br>Practice Test 1</h1><p>6 Parts • 32 questions • Tự chấm • Post-Reading Review • Retry</p><div class="form-grid"><div class="field"><label>Họ và tên học sinh</label><input id="studentName" autocomplete="name" placeholder="Nhập họ và tên"></div><div class="field"><label>Chế độ luyện tập</label><select id="modeSelect"><option value="">-- Chọn chế độ --</option><option value="timed">Timed Practice — Có áp lực thời gian</option><option value="untimed">Untimed Practice — Luyện tập tự do</option></select></div></div><div id="durationField" class="field hidden" style="margin-top:14px"><label>Thời gian cho Timed Practice (phút)</label><input id="durationMin" type="number" min="1" max="180" placeholder="Nhập thời gian giáo viên yêu cầu"></div><div class="rules"><strong>Trước khi bắt đầu</strong><br>• Đáp án và giải thích chỉ xuất hiện sau khi nộp.<br>• Bài làm được lưu tự động trên trình duyệt.<br>• Timed Practice sẽ tự nộp khi hết thời gian; Untimed Practice không có countdown.</div><label class="confirm"><input id="confirmStart" type="checkbox"><span>Tôi đã đọc hướng dẫn và sẵn sàng bắt đầu bài thi.</span></label><div class="start-actions"><button class="btn primary" id="startBtn">BẮT ĐẦU LÀM BÀI</button></div></section></main>`;
 const mode=document.getElementById('modeSelect');mode.addEventListener('change',()=>document.getElementById('durationField').classList.toggle('hidden',mode.value!=='timed'));
 document.getElementById('startBtn').onclick=()=>{const name=document.getElementById('studentName').value.trim(),m=mode.value,ok=document.getElementById('confirmStart').checked;let dur=null;if(m==='timed')dur=parseInt(document.getElementById('durationMin').value,10);if(!name)return toast('Vui lòng nhập họ và tên.');if(!m)return toast('Vui lòng chọn chế độ luyện tập.');if(m==='timed'&&(!dur||dur<1))return toast('Vui lòng nhập thời gian Timed Practice.');if(!ok)return toast('Vui lòng xác nhận đã đọc hướng dẫn.');state.student=name;state.mode=m;state.durationMin=dur;state.startTime=Date.now();state.endTime=m==='timed'?state.startTime+dur*60000:null;save();renderExam();}
}
function topbar(){const submitBtn=state.submitted?'':`<button class="btn small" onclick="manualSubmit()">NỘP BÀI</button>`;return `<header class="topbar"><div class="topbar-inner"><div class="brand">PET Reading • Test 1</div><div class="statusline"><span class="chip optional">👤 ${esc(state.student)}</span><span class="chip">Part ${state.currentPart}/6</span><span class="chip"><span id="answeredChip">${answeredCount()}</span>/32 answered</span><span class="chip optional">${state.mode==='timed'?'Timed':'Untimed'}</span><span class="chip" id="clockChip">⏱ —</span><span class="grow"></span><span class="chip optional" id="saveChip">Đã lưu</span>${submitBtn}</div></div></header>`}
function nav(){let tabs='';for(let p=1;p<=6;p++)tabs+=`<button class="part-tab ${state.currentPart===p?'active':''}" onclick="goPart(${p})">Part ${p}</button>`;let qs='';for(let q=1;q<=32;q++){qs+=`<button class="navq ${status(q)} ${state.flags[q]?'flagged':''} ${state.currentQ===q?'current':''}" onclick="goQ(${q})" aria-label="Question ${q}">${q}</button>`}return `<div class="part-tabs">${tabs}</div><nav class="bottomnav" aria-label="Question navigator"><button class="bnbtn" onclick="goQ(Math.max(1,state.currentQ-1))">‹ Previous</button><div class="navscroll">${qs}</div><button class="bnbtn" onclick="goQ(Math.min(32,state.currentQ+1))">Next ›</button></nav>`}

function selectOption(q,v){if(state.submitted||state.retry?.active)return;state.answers[q]=v;state.currentQ=q;save();renderExam(false)}
function renderOptionButtons(q,opts){return `<div class="options">${Object.entries(opts).map(([k,v])=>`<button class="option ${state.answers[q]===k?'selected':''}" onclick="selectOption(${q},'${k}')"><span class="letter">${k}</span><span>${esc(v)}</span></button>`).join('')}</div>`}
function sourceUnit(x){if(x.style==='email'){return `<div class="emailbox"><div class="emailhead"><b>To:</b> ${esc(x.source.to)}</div><div class="emailhead"><b>From:</b> ${esc(x.source.from)}</div><div class="emailbody">${esc(x.source.body)}</div></div>`}if(x.style==='phone'){return `<div class="phonebox">${esc(x.sourceText)}</div>`}return `<div class="noticebox">${x.title?`<h3>${esc(x.title)}</h3>`:''}${esc(x.sourceText)}</div>`}
function renderPart1(){return partHead(1,'Short Messages / Notices','For each question, choose the correct answer.')+TEST.part1.map(x=>`<article id="q${x.n}" class="question-card"><div class="qtop"><div class="qnum">Question ${x.n}</div>${flagBtn(x.n)}</div><div class="source-grid"><div class="source-card">${sourceUnit(x)}</div><div>${renderOptionButtons(x.n,x.options)}</div></div></article>`).join('')}

function renderPart2(){const profiles=Object.entries(TEST.part2Profiles).map(([q,t])=>`<article id="q${q}" class="question-card profile"><div class="qtop"><div class="qnum">Question ${q}</div>${flagBtn(q)}</div><p>${esc(t)}</p><div class="picker">${Object.keys(TEST.part2Bank).map(k=>`<button class="${state.answers[q]===k?'selected':''}" onclick="selectBank(${q},'${k}')">${k}</button>`).join('')}</div></article>`).join('');const bank=Object.entries(TEST.part2Bank).map(([k,o])=>`<div class="bank-card"><h4><span class="bank-letter">${k}</span>${esc(o.title)}</h4><div>${esc(o.text)}</div></div>`).join('');return partHead(2,'Matching','The young people below all want to buy a present for someone. On the opposite page there are descriptions of eight places to buy items. Decide which place would be the most suitable for the people below.')+`<div class="part2-layout part2scroll"><div class="profiles">${profiles}</div><aside class="bank">${bank}</aside></div>`}

function p4Gap(q){return `<span class="gap-control" id="q${q}"><span class="gap-number">${q}</span><select class="gap-select" onchange="selectOption(${q},this.value)"><option value="">—</option>${Object.keys(TEST.part4Bank).map(k=>`<option value="${k}" ${state.answers[q]===k?'selected':''}>${k}</option>`).join('')}</select></span>`}
function renderPart4(){let text=esc(TEST.part4Segments[0])+p4Gap(16)+esc(TEST.part4Segments[1])+p4Gap(17)+esc(TEST.part4Segments[2])+p4Gap(18)+esc(TEST.part4Segments[3])+p4Gap(19)+esc(TEST.part4Segments[4])+p4Gap(20)+esc(TEST.part4Segments[5]);text=text.replace(/\n\n/g,'</p><p>');const bank=Object.entries(TEST.part4Bank).map(([k,v])=>`<div class="bank-card"><b><span class="bank-letter">${k}</span></b>${esc(v)}</div>`).join('');return partHead(4,'Gapped Text','Five sentences have been removed from the text below. For each question, choose the correct answer. There are three extra sentences which you do not need to use.')+`<div class="split dualscroll"><div class="passage-box gapped-passage"><h3>My Love of Music</h3><div class="subtitle">Kirsty Sinclair explains why music is so important in her life.</div><p>${text}</p></div><aside class="bank">${bank}</aside></div>`}

function renderPart6(){let s=esc(TEST.part6Parts[0])+p6Gap(27)+esc(TEST.part6Parts[1])+p6Gap(28)+esc(TEST.part6Parts[2])+p6Gap(29)+esc(TEST.part6Parts[3])+p6Gap(30)+esc(TEST.part6Parts[4])+p6Gap(31)+esc(TEST.part6Parts[5])+p6Gap(32)+esc(TEST.part6Parts[6]);return partHead(6,'Open Cloze','For each question, write the correct answer. Write one word for each gap.')+`<div class="passage-box gapped-passage" style="max-width:900px;margin:auto;max-height:none"><h3>Jacket Potatoes</h3><div class="subtitle">By Helen Aylin</div><p>${s}</p></div>`}

function renderExam(scroll=true){app.innerHTML=topbar()+`<main class="exam">${nav()}<div id="partContent">${renderCurrentPart()}</div></main>`;startTimer();setTimeout(()=>document.querySelector('.bottomnav .navq.current')?.scrollIntoView({block:'nearest',inline:'center'}),0);if(scroll){const q=document.getElementById('q'+state.currentQ);if(q)setTimeout(()=>q.scrollIntoView({block:'center'}),50)}}

function submit(auto){if(state.submitted)return;state.submitted=true;state.submitTime=Date.now();state.result=scoreAttempt(state.answers);save();clearInterval(timerId);renderResults();if(auto)toast('Hết giờ. Bài đã được tự động nộp.')}
function diagnosis(){const r=state.result;const labels={1:'Purpose & implication',2:'Matching conditions & paraphrase',3:'Detailed reading / inference / attitude',4:'Cohesion / reference / gapped text',5:'Vocabulary / collocations / lexical choice',6:'Grammar / function words / open cloze'};const arr=[];for(let p=1;p<=6;p++){const x=r.perPart[p];arr.push({p,rate:x.correct/x.total,label:labels[p],score:`${x.correct}/${x.total}`})}arr.sort((a,b)=>a.rate-b.rate);const weakest=arr.filter(x=>x.rate<1).slice(0,2);return weakest.length?`Ưu tiên ôn: ${weakest.map(x=>`Part ${x.p} — ${x.label} (${x.score})`).join('; ')}. Nhận xét này chỉ dựa trên kết quả của attempt hiện tại.`:'Bạn đã trả lời đúng toàn bộ các câu trong attempt này.'}
function renderResults(){const r=state.result||scoreAttempt(state.answers);const ps=Object.entries(r.perPart).map(([p,x])=>`<div class="metric"><span>Part ${p}</span><strong>${x.correct}/${x.total}</strong></div>`).join('');app.innerHTML=`${topbar()}<main class="results"><div class="eyebrow">RESULTS / DIAGNOSIS</div><h1>Reading Practice Test 1</h1><p>${esc(state.student)} • ${state.mode==='timed'?'Timed Practice':'Untimed Practice'} • Time used ${formatTime(elapsedMs())}</p><div class="result-summary"><div class="metric"><span>Score</span><strong>${r.correct}/32</strong></div><div class="metric"><span>Accuracy</span><strong>${r.accuracy}%</strong></div><div class="metric"><span>Incorrect</span><strong>${r.incorrect}</strong></div><div class="metric"><span>Unanswered</span><strong>${r.blank}</strong></div></div><div class="part-scores">${ps}</div><div class="result-card diag"><h3>Skill review</h3><p>${esc(diagnosis())}</p></div><div class="retrybar"><b>TEST → ERROR → UNDERSTAND → RETRY → MASTER</b><br>Đọc Detailed Review bên dưới, sau đó có thể làm lại riêng các câu sai/bỏ trống mà không ghi đè attempt đầu tiên.</div><div class="review-toolbar"><button class="btn filterbtn active" onclick="setFilter('all',this)">TẤT CẢ</button><button class="btn filterbtn" onclick="setFilter('wrong',this)">CÂU SAI</button><button class="btn filterbtn" onclick="setFilter('correct',this)">CÂU ĐÚNG</button><button class="btn filterbtn" onclick="setFilter('blank',this)">BỎ TRỐNG</button><button class="btn filterbtn" onclick="setFilter('flagged',this)">ĐÃ ĐÁNH DẤU</button><button class="btn" onclick="copySummary()">SAO CHÉP KẾT QUẢ TÓM TẮT</button><button class="btn primary" onclick="startRetry()">RETRY WRONG QUESTIONS</button><button class="btn danger" onclick="reset()">LÀM LẠI TỪ ĐẦU</button></div><section id="reviewList">${renderReviews()}</section></main>`;updateClock()}
function reviewStatus(q){const a=state.answers[q];if(a===undefined||String(a).trim()==='')return 'blank';return isCorrect(q,a)?'correct':'incorrect'}
function setFilter(f,btn){activeReviewFilter=f;document.querySelectorAll('.filterbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('reviewList').innerHTML=renderReviews()}
function shouldShowReview(q){const s=reviewStatus(q);if(activeReviewFilter==='all')return true;if(activeReviewFilter==='wrong')return s==='incorrect';if(activeReviewFilter==='correct')return s==='correct';if(activeReviewFilter==='blank')return s==='blank';if(activeReviewFilter==='flagged')return !!state.flags[q];return true}
function displayAnswer(q,a){if(a===undefined||String(a).trim()==='')return 'Chưa trả lời';if(q<=26){if(q<=5)return `${a} — ${TEST.part1.find(x=>x.n===q)?.options?.[a]||TEST.part3Questions[q]?.options?.[a]||TEST.part5Options[q]?.[a]||TEST.part4Bank[a]||TEST.part2Bank[a]?.title||a}`;if(q<=10)return `${a} — ${TEST.part2Bank[a]?.title||a}`;if(q<=15)return `${a} — ${TEST.part3Questions[q].options[a]}`;if(q<=20)return `${a} — ${TEST.part4Bank[a]}`;return `${a} — ${TEST.part5Options[q][a]}`}return String(a)}
function reviewQuestionText(q){const r=TEST.reviews[q]||{};return r.relevantText||''}
function evidenceJump(q){const p=partOf(q);if(p===3){state.currentPart=3;state.currentQ=q;save();renderExam(false);setTimeout(()=>{const el=document.getElementById('p3-'+TEST.part3Questions[q].evidenceP);el?.classList.add('evidence-highlight');el?.scrollIntoView({behavior:'smooth',block:'center'})},100)}else toast('Evidence được hiển thị trực tiếp trong review card cho Part này.')}
function renderReviews(){let out='';for(let q=1;q<=32;q++){if(!shouldShowReview(q))continue;const r=TEST.reviews[q]||{},s=reviewStatus(q),vocab=(r.vocabulary||[]).map(x=>`<div>• ${esc(x)}</div>`).join(''),dist=(r.distractors||[]).map(x=>`<div>• ${esc(x)}</div>`).join(''),coh=r.cohesionMap?Object.entries(r.cohesionMap).map(([k,v])=>`<div><b>${esc(k)}</b>: ${esc(v)}</div>`).join(''):'';out+=`<article class="review-card ${s}" id="review${q}"><div class="qtop"><div><div class="qnum">Question ${q} • Part ${partOf(q)}</div><strong>${s==='correct'?'✓ ĐÚNG':s==='incorrect'?'✕ SAI':'— BỎ TRỐNG'}</strong></div>${partOf(q)===3?`<button class="btn small" onclick="evidenceJump(${q})">XEM VỊ TRÍ TRONG BÀI</button>`:''}</div><div class="review-grid"><div class="review-box"><h5>Your Answer</h5>${esc(displayAnswer(q,state.answers[q]))}</div><div class="review-box"><h5>Correct Answer</h5>${esc(displayAnswer(q,TEST.answers[q]))}</div><div class="review-box evidence"><h5>Question / Relevant Text</h5><div class="review-source">${esc(r.relevantText||'')}</div></div><div class="review-box evidence"><h5>Key Evidence</h5><div class="review-source">${esc(r.keyEvidence||'')}</div>${coh?`<div style="margin-top:8px">${coh}</div>`:''}</div><div class="review-box explain"><h5>Vì sao đáp án đúng?</h5>${esc(r.explanationVi||'')}</div>${dist?`<div class="review-box trap"><h5>Why / Distractor</h5>${dist}</div>`:''}${r.paraphrase?`<div class="review-box lang"><h5>Paraphrase / Meaning Connection</h5>${esc(r.paraphrase)}</div>`:''}${vocab?`<div class="review-box lang"><h5>Vocabulary / Chunks</h5>${vocab}</div>`:''}${r.grammarPoint?`<div class="review-box lang"><h5>Grammar / Language Point</h5>${esc(r.grammarPoint)}</div>`:''}${r.nextTimeFocus?`<div class="review-box next"><h5>Lần sau cần chú ý gì?</h5>${esc(r.nextTimeFocus)}</div>`:''}</div></article>`}return out||'<div class="result-card" style="padding:20px">Không có câu phù hợp bộ lọc.</div>'}
function copySummary(){const r=state.result;let t=`PET READING PRACTICE TEST 1\nStudent: ${state.student}\nMode: ${state.mode}\nTime used: ${formatTime(elapsedMs())}\nScore: ${r.correct}/32 (${r.accuracy}%)\nIncorrect: ${r.incorrect} | Unanswered: ${r.blank}\n`;for(let p=1;p<=6;p++)t+=`Part ${p}: ${r.perPart[p].correct}/${r.perPart[p].total}\n`;t+=`\n${diagnosis()}\n`;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Đã sao chép kết quả.')).catch(()=>fallbackCopy(t))}else fallbackCopy(t)}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Đã sao chép kết quả.')}catch(e){toast('Không thể tự động sao chép.')}ta.remove()}
function startRetry(){const targets=[];for(let q=1;q<=32;q++)if(reviewStatus(q)!=='correct')targets.push(q);if(!targets.length)return toast('Không có câu sai hoặc bỏ trống để retry.');state.retry={active:true,targets,answers:{},started:Date.now(),submitted:false};save();renderRetry()}
function renderRetry(){const targets=state.retry.targets;app.innerHTML=`<header class="topbar"><div class="topbar-inner"><div class="brand">Retry Wrong Questions</div><div class="statusline"><span class="chip">${targets.length} câu cần làm lại</span><span class="grow"></span><button class="btn small" onclick="submitRetry()">NỘP RETRY</button><button class="btn ghost small" onclick="cancelRetry()">VỀ KẾT QUẢ</button></div></div></header><main class="exam"><div class="part-head"><h2>Retry Mode</h2><div class="instruction">Chỉ các câu sai/bỏ trống của attempt đầu tiên được mở. Đáp án đúng và giải thích đang được ẩn.</div></div>${renderRetryParts()}</main>`}
function retryAnswer(q,v){state.retry.answers[q]=v;save();renderRetry()}
function retryOption(q,opts){return `<div class="options">${Object.entries(opts).map(([k,v])=>`<button class="option ${state.retry.answers[q]===k?'selected':''}" onclick="retryAnswer(${q},'${k}')"><span class="letter">${k}</span><span>${esc(v)}</span></button>`).join('')}</div>`}
function renderRetryParts(){let out='';for(let p=1;p<=6;p++){const qs=state.retry.targets.filter(q=>partOf(q)===p);if(!qs.length)continue;out+=`<section class="part-head"><h2>Part ${p}</h2></section>`;if(p===1){for(const q of qs){const x=TEST.part1.find(x=>x.n===q);out+=`<article class="question-card"><div class="qnum">Question ${q}</div><div class="source-grid"><div class="source-card">${sourceUnit(x)}</div><div>${retryOption(q,x.options)}</div></div></article>`}}else if(p===2){out+=`<div class="part2-layout"><div>`;for(const q of qs)out+=`<article class="question-card"><div class="qnum">Question ${q}</div><p>${esc(TEST.part2Profiles[q])}</p><div class="picker">${Object.keys(TEST.part2Bank).map(k=>`<button class="${state.retry.answers[q]===k?'selected':''}" onclick="retryAnswer(${q},'${k}')">${k}</button>`).join('')}</div></article>`;out+=`</div><aside class="bank">${Object.entries(TEST.part2Bank).map(([k,o])=>`<div class="bank-card"><h4><span class="bank-letter">${k}</span>${esc(o.title)}</h4>${esc(o.text)}</div>`).join('')}</aside></div>`}else if(p===3){out+=`<div class="split"><div class="passage-box"><h3>The New School</h3>${TEST.part3Text.map(x=>`<p>${esc(x)}</p>`).join('')}</div><div>`;for(const q of qs){const o=TEST.part3Questions[q];out+=`<article class="question-card"><div class="qnum">Question ${q}</div><p><b>${esc(o.stem)}</b></p>${retryOption(q,o.options)}</article>`}out+='</div></div>'}else if(p===4){let text=esc(TEST.part4Segments[0])+retryGap(16,qs)+esc(TEST.part4Segments[1])+retryGap(17,qs)+esc(TEST.part4Segments[2])+retryGap(18,qs)+esc(TEST.part4Segments[3])+retryGap(19,qs)+esc(TEST.part4Segments[4])+retryGap(20,qs)+esc(TEST.part4Segments[5]);text=text.replace(/\n\n/g,'</p><p>');out+=`<div class="split dualscroll"><div class="passage-box gapped-passage"><h3>My Love of Music</h3><p>${text}</p></div><aside class="bank">${Object.entries(TEST.part4Bank).map(([k,v])=>`<div class="bank-card"><span class="bank-letter">${k}</span>${esc(v)}</div>`).join('')}</aside></div>`}else if(p===5){let s=esc(TEST.part5Parts[0])+retryGap(21,qs)+esc(TEST.part5Parts[1])+retryGap(22,qs)+esc(TEST.part5Parts[2])+retryGap(23,qs)+esc(TEST.part5Parts[3])+retryGap(24,qs)+esc(TEST.part5Parts[4])+retryGap(25,qs)+esc(TEST.part5Parts[5])+retryGap(26,qs)+esc(TEST.part5Parts[6]);out+=`<div class="split"><div class="passage-box gapped-passage"><h3>Camels</h3><p>${s}</p></div><div>`;for(const q of qs)out+=`<article class="question-card"><div class="qnum">Question ${q}</div>${retryOption(q,TEST.part5Options[q])}</article>`;out+='</div></div>'}else{let s=esc(TEST.part6Parts[0])+retryTextGap(27,qs)+esc(TEST.part6Parts[1])+retryTextGap(28,qs)+esc(TEST.part6Parts[2])+retryTextGap(29,qs)+esc(TEST.part6Parts[3])+retryTextGap(30,qs)+esc(TEST.part6Parts[4])+retryTextGap(31,qs)+esc(TEST.part6Parts[5])+retryTextGap(32,qs)+esc(TEST.part6Parts[6]);out+=`<div class="passage-box gapped-passage" style="max-height:none"><h3>Jacket Potatoes</h3><p>${s}</p></div>`}}return out}
function retryGap(q,targets){if(!targets.includes(q))return `<span class="gap-control"><span class="gap-number">${q}</span><b>${esc(state.answers[q])}</b></span>`;const bank=q<=20?TEST.part4Bank:TEST.part5Options[q];return `<span class="gap-control"><span class="gap-number">${q}</span><select class="gap-select" onchange="retryAnswer(${q},this.value)"><option value="">—</option>${Object.keys(bank).map(k=>`<option value="${k}" ${state.retry.answers[q]===k?'selected':''}>${k}</option>`).join('')}</select></span>`}
function retryTextGap(q,targets){if(!targets.includes(q))return `<span class="gap-control"><span class="gap-number">${q}</span><b>${esc(state.answers[q])}</b></span>`;return `<span class="gap-control"><span class="gap-number">${q}</span><input class="gap-input" value="${esc(state.retry.answers[q]||'')}" oninput="state.retry.answers[${q}]=this.value;save()" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off"></span>`}
function submitRetry(){const targets=state.retry.targets;let correct=0;for(const q of targets)if(isCorrect(q,state.retry.answers[q]))correct++;state.retry.submitted=true;state.retry.submitTime=Date.now();state.retry.score={correct,total:targets.length};save();alert(`Retry score: ${correct}/${targets.length}`);state.retry.active=false;save();renderResults()}
function cancelRetry(){state.retry.active=false;save();renderResults()}
load();if(state.retry?.active)renderRetry();else if(state.submitted)renderResults();else if(state.startTime)renderExam(false);else showStart();
</script>
</body></html>
